<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel & DC Trivia</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Marvel & DC Quiz</h1>

        
        <div id="start-screen" class="screen">
            <p>Can you answer all the questions correctly about Marvel and DC?</p>
            <input type="text" id="player-name" placeholder="Enter your name here...">
            <button id="start-button" onclick="startQuiz()" class="button">Start Quiz</button>
        </div>

        
        <div id="quiz" class="screen" style="display: none;"></div>

        
        <div id="result" class="screen"></div>

        
        <div id="leaderboard" class="screen" style="display: none;"></div>
    </div>
</body>
</html>
